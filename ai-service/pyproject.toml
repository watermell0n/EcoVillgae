[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ecovillage-ai-service"
version = "0.1.0"
description = "이코빌리지 내부 AI 생성 서비스"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.43,<2",
  "fastapi>=0.115,<1",
  "openai>=2.50,<3",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
ecovillage-ai-evaluate = "ecovillage_ai.evaluation:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecovillage_ai"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "provider_smoke: 실제 AI 공급자 자격증명이 있을 때만 명시적으로 실행하는 smoke 테스트",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
