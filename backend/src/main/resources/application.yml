spring:
  application:
    name: ecovillage
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    teacher-session-hours: 8
    student-session-hours: 48
    admin-session-hours: 8
  survey:
    url: ${SURVEY_URL:https://example.com/survey}
  product-images:
    directory: ${PRODUCT_IMAGE_DIR:./data/product-images}
