name: ${COMPOSE_PROJECT_NAME:-ecovillage}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecovillage}
      POSTGRES_USER: ${POSTGRES_USER:-ecovillage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecovillage_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ecovillage} -d ${POSTGRES_DB:-ecovillage}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  otel-collector:
    image: otel/opentelemetry-collector:0.157.0
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"

volumes:
  postgres-data:
  redis-data:
