name: ${COMPOSE_PROJECT_NAME:-ecovillage}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecovillage}
      POSTGRES_USER: ${POSTGRES_USER:-ecovillage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecovillage_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-ecovillage} -d ${POSTGRES_DB:-ecovillage}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  otel-collector:
    image: otel/opentelemetry-collector:0.157.0
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"

  ai-service:
    build:
      context: ./ai-service
    environment:
      ECOVILLAGE_AI_ENVIRONMENT: ${ECOVILLAGE_AI_ENVIRONMENT:-local}
      ECOVILLAGE_AI_INTERNAL_SERVICE_TOKEN: ${ECOVILLAGE_AI_INTERNAL_SERVICE_TOKEN:-local-development-token}
      ECOVILLAGE_AI_INTERNAL_SERVICE_SCOPES: ${ECOVILLAGE_AI_INTERNAL_SERVICE_SCOPES:-ai:generate:balancing,ai:generate:teacher-chat,ai:generate:economic-event,ai:generate:quiz-draft}
      ECOVILLAGE_AI_PROVIDER: ${ECOVILLAGE_AI_PROVIDER:-FAKE}
      # 값을 채우면 공급자별 모델 지정을 덮어쓴다. FAKE는 비어 있어도 deterministic-v1로 동작한다.
      ECOVILLAGE_AI_MODEL_ID: ${ECOVILLAGE_AI_MODEL_ID:-}
      ECOVILLAGE_AI_OPENAI_ENABLED: ${ECOVILLAGE_AI_OPENAI_ENABLED:-false}
      ECOVILLAGE_AI_OPENAI_MODEL_ID: ${ECOVILLAGE_AI_OPENAI_MODEL_ID:-}
      ECOVILLAGE_AI_BEDROCK_MODEL_ID: ${ECOVILLAGE_AI_BEDROCK_MODEL_ID:-}
      # 기능별 공급자 경로. 형식은 공급자:모델ID 이며 비우면 위 기본 공급자를 쓴다.
      ECOVILLAGE_AI_ROUTE_BALANCING: ${ECOVILLAGE_AI_ROUTE_BALANCING:-}
      ECOVILLAGE_AI_ROUTE_TEACHER_CHAT: ${ECOVILLAGE_AI_ROUTE_TEACHER_CHAT:-}
      ECOVILLAGE_AI_ROUTE_ECONOMIC_EVENT: ${ECOVILLAGE_AI_ROUTE_ECONOMIC_EVENT:-}
      ECOVILLAGE_AI_ROUTE_QUIZ_DRAFT: ${ECOVILLAGE_AI_ROUTE_QUIZ_DRAFT:-}
      # OpenAI 호환 자격증명. GMS 프록시를 쓸 때 base URL을 함께 넘긴다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ECOVILLAGE_AI_PROVIDER_TIMEOUT_SECONDS: ${ECOVILLAGE_AI_PROVIDER_TIMEOUT_SECONDS:-10}
      ECOVILLAGE_AI_MAX_OUTPUT_TOKENS: ${ECOVILLAGE_AI_MAX_OUTPUT_TOKENS:-4096}
      ECOVILLAGE_AI_MINIMUM_DEADLINE_REMAINING_SECONDS: ${ECOVILLAGE_AI_MINIMUM_DEADLINE_REMAINING_SECONDS:-0.05}
      ECOVILLAGE_AI_DOCS_ENABLED: ${ECOVILLAGE_AI_DOCS_ENABLED:-true}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    profiles:
      - app
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-ecovillage}
      POSTGRES_USER: ${POSTGRES_USER:-ecovillage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecovillage_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_INTERNAL_SERVICE_TOKEN: ${ECOVILLAGE_AI_INTERNAL_SERVICE_TOKEN:-local-development-token}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-14d}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-development-jwt-secret-change-before-deploy}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-local-development-token-pepper-change-before-deploy}
      AUTH_LOGIN_ATTEMPT_LIMIT: ${AUTH_LOGIN_ATTEMPT_LIMIT:-20}
      AUTH_LOGIN_ATTEMPT_WINDOW: ${AUTH_LOGIN_ATTEMPT_WINDOW:-1m}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
