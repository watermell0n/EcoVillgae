openapi: 3.1.0
info:
  title: BIBIM Spring-FastAPI Internal AI API
  version: 1.0.0
  description: |
    Spring 통합 API가 집계·권한·정책 범위를 확정한 뒤 FastAPI 생성 서비스에
    전달하는 내부 전용 계약이다. 이 API는 사용자 토큰과 학생 개인 데이터를 받지
    않으며 생성 결과를 직접 게시하거나 정책에 적용하지 않는다.
servers:
  - url: http://ai-service:8000
    description: Container network
tags:
  - name: Internal AI Generations
security:
  - internalServiceBearer: []
paths:
  /internal/v1/generations/balancing:
    post:
      tags: [Internal AI Generations]
      operationId: generateBalancingProposal
      summary: 집계 경제 지표에서 허용 범위 내 밸런싱 설명과 제안을 생성한다.
      x-required-scope: ai:generate:balancing
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AiRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalancingGenerationRequest'
      responses:
        '200':
          description: 검증 가능한 구조화 생성 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancingGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/ProviderRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/generations/teacher-chat:
    post:
      tags: [Internal AI Generations]
      operationId: generateTeacherChatAnswer
      summary: 허용된 학급 집계 사실만 근거로 교사용 답변을 생성한다.
      x-required-scope: ai:generate:teacher-chat
      x-total-timeout-seconds: 20
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AiRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherChatGenerationRequest'
      responses:
        '200':
          description: 근거가 연결된 교사용 답변
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherChatGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/ProviderRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/generations/economic-event:
    post:
      tags: [Internal AI Generations]
      operationId: generateEconomicEventDraft
      summary: 규칙 엔진이 정한 효과를 설명하는 경제 이벤트 문구를 생성한다.
      x-required-scope: ai:generate:economic-event
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AiRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomicEventGenerationRequest'
      responses:
        '200':
          description: 교사 검토가 필요한 이벤트 문구 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicEventGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/ProviderRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/generations/quiz-draft:
    post:
      tags: [Internal AI Generations]
      operationId: generateQuizDraft
      summary: 학년과 학습목표에 맞는 REVIEW_REQUIRED 퀴즈 초안을 생성한다.
      x-required-scope: ai:generate:quiz-draft
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AiRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizDraftGenerationRequest'
      responses:
        '200':
          description: 교사 검토가 필요한 퀴즈 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDraftGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/ProviderRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
components:
  securitySchemes:
    internalServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: short-lived-service-token
      description: 기능별 ai:generate:* scope가 포함된 내부 서비스 토큰
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AiRunId:
      name: X-AI-Run-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 입력 계약 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 내부 서비스 scope 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: AI 실행 문맥 불일치
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: 데이터 부족 또는 생성 결과 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderRateLimited:
      description: 공급자 호출 제한
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: 공급자 일시 장애
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DeadlineExceeded:
      description: 전달된 절대 기한 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CommonRequestFields:
      type: object
      required:
        - ai_run_id
        - request_id
        - correlation_id
        - schema_version
        - prompt_version
        - attempt
        - deadline_at
        - locale
        - grade
      properties:
        ai_run_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        schema_version:
          type: string
          const: '1.0'
        prompt_version:
          type: string
          pattern: '^[a-z0-9-]+-v[1-9][0-9]*$'
        attempt:
          type: integer
          enum: [1, 2]
        deadline_at:
          type: string
          format: date-time
        locale:
          type: string
          const: ko-KR
        grade:
          type: integer
          enum: [4, 5, 6]
    Period:
      type: object
      additionalProperties: false
      required: [from, to, data_as_of]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        data_as_of:
          type: string
          format: date-time
    Sample:
      type: object
      additionalProperties: false
      required: [active_students, related_transactions, status]
      properties:
        active_students:
          type: integer
          minimum: 5
        related_transactions:
          type: integer
          minimum: 10
        status:
          type: string
          const: SUFFICIENT
    Metric:
      type: object
      additionalProperties: false
      required: [code, availability, value, unit, state, direction, unavailable_reason]
      properties:
        code:
          type: string
          enum:
            - LIQUID_MONEY_CHANGE_RATE_BPS
            - ISSUANCE_AMOUNT
            - RECOVERY_AMOUNT
            - ISSUANCE_RECOVERY_RATE_BPS
            - WALLET_AVERAGE_CHANGE_RATE_BPS
            - WALLET_MEDIAN_CHANGE_RATE_BPS
            - ASSET_CONCENTRATION_TOP20_BPS
            - CONSUMPTION_RATE_BPS
            - PRODUCT_SELL_THROUGH_RATE_BPS
            - PRODUCT_STOCKOUT_SHARE_BPS
            - FINANCIAL_PARTICIPATION_RATE_BPS
            - PAYMENT_MISS_RATE_BPS
            - INVESTMENT_PARTICIPATION_RATE_BPS
            - INVESTMENT_MEDIAN_RETURN_BPS
            - INVESTMENT_LOSS_PARTICIPANT_RATE_BPS
            - REWARD_ISSUANCE_SHARE_BPS
        value:
          type: [integer, 'null']
        previous_value:
          type: [integer, 'null']
        availability:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        unavailable_reason:
          type: [string, 'null']
          maxLength: 200
        unit:
          type: string
          enum: [AMOUNT, COUNT, RATE_BPS]
        state:
          type: string
          enum: [NORMAL, OBSERVE, WARN, UNAVAILABLE]
        direction:
          type: string
          enum: [LOW, NORMAL, HIGH, NOT_APPLICABLE]
        subject_label:
          type: [string, 'null']
          maxLength: 100
    AllowedAction:
      type: object
      additionalProperties: false
      required:
        - action_id
        - target_type
        - target_id
        - current_value
        - min_value
        - max_value
        - unit
      properties:
        action_id:
          type: string
          minLength: 1
          maxLength: 100
        target_type:
          type: string
          enum:
            - PRODUCT_PRICE
            - PRODUCT_STOCK
            - ACTIVITY_REWARD
            - GAME_REWARD
            - QUIZ_REWARD
            - TAX_RATE
            - INFLATION_RATE
            - DEPOSIT_RATE
            - SAVINGS_RATE
            - LOAN_RATE
        target_id:
          type: string
          format: uuid
        current_value:
          type: integer
          minimum: 0
        min_value:
          type: integer
          minimum: 0
        max_value:
          type: integer
          minimum: 0
        unit:
          type: string
          enum: [AMOUNT, COUNT, RATE_BPS]
        label:
          type: string
          minLength: 1
          maxLength: 100
    BalancingPayload:
      type: object
      additionalProperties: false
      required:
        - metric_version
        - threshold_version
        - period
        - sample
        - metrics
        - allowed_actions
      properties:
        metric_version:
          type: string
          const: economic-metrics-v1
        threshold_version:
          type: string
          const: economic-thresholds-v1
        period:
          $ref: '#/components/schemas/Period'
        sample:
          $ref: '#/components/schemas/Sample'
        metrics:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Metric'
        allowed_actions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AllowedAction'
    BalancingGenerationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CommonRequestFields'
        - type: object
          required: [payload]
          properties:
            payload:
              $ref: '#/components/schemas/BalancingPayload'
    BalancingProposal:
      type: object
      additionalProperties: false
      required:
        - action_id
        - proposed_value
        - evidence_metric_codes
        - rationale
        - expected_effect
        - side_effects
        - priority
      properties:
        action_id:
          type: string
          minLength: 1
          maxLength: 100
        proposed_value:
          type: integer
          minimum: 0
        evidence_metric_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        rationale:
          type: string
          minLength: 1
          maxLength: 1000
        expected_effect:
          type: string
          minLength: 1
          maxLength: 1000
        side_effects:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 300
        priority:
          type: integer
          minimum: 1
          maximum: 100
    BalancingOutput:
      type: object
      additionalProperties: false
      required: [summary, evidence_metric_codes, causes, proposals]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 1500
        evidence_metric_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        causes:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 500
        proposals:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/BalancingProposal'
    Fact:
      type: object
      additionalProperties: false
      required: [fact_id, label, value, unit]
      properties:
        fact_id:
          type: string
          minLength: 1
          maxLength: 100
        label:
          type: string
          minLength: 1
          maxLength: 150
        value:
          oneOf:
            - type: integer
            - type: string
              maxLength: 500
        unit:
          type: string
          enum: [AMOUNT, COUNT, RATE_BPS, STATUS, TEXT]
    PolicyChangeFact:
      type: object
      additionalProperties: false
      required: [fact_id, changed_at, summary]
      properties:
        fact_id:
          type: string
          minLength: 1
          maxLength: 100
        changed_at:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
          maxLength: 500
    TeacherChatPayload:
      type: object
      additionalProperties: false
      required: [question, period, facts, recent_policy_changes]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
        period:
          $ref: '#/components/schemas/Period'
        facts:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Fact'
        recent_policy_changes:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PolicyChangeFact'
    TeacherChatGenerationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CommonRequestFields'
        - type: object
          required: [payload]
          properties:
            payload:
              $ref: '#/components/schemas/TeacherChatPayload'
    Recommendation:
      type: object
      additionalProperties: false
      required: [text, side_effects]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 700
        side_effects:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 300
    TeacherChatOutput:
      type: object
      additionalProperties: false
      required: [answer, evidence_fact_ids, recommendations, period, data_as_of]
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 3000
        evidence_fact_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        recommendations:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Recommendation'
        period:
          $ref: '#/components/schemas/Period'
        data_as_of:
          type: string
          format: date-time
    EventTemplateType:
      type: string
      enum:
        - PRICE
        - SUPPLY
        - TAX
        - INTEREST_RATE
        - INVESTMENT_NEWS
        - REWARD
        - PUBLIC_FUND
    EconomicEventPayload:
      type: object
      additionalProperties: false
      required: [template_type, effect_summary, prohibited_effects]
      properties:
        template_type:
          $ref: '#/components/schemas/EventTemplateType'
        interest_rate_scope:
          type: [string, 'null']
          enum: [DEPOSIT, SAVINGS, LOAN, null]
        effect_summary:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 300
        prohibited_effects:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 200
        teacher_context:
          type: [string, 'null']
          maxLength: 1000
    EconomicEventGenerationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CommonRequestFields'
        - type: object
          required: [payload]
          properties:
            payload:
              $ref: '#/components/schemas/EconomicEventPayload'
    EventChoice:
      type: object
      additionalProperties: false
      required: [choice_key, label, consequence_text]
      properties:
        choice_key:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,31}$'
        label:
          type: string
          minLength: 1
          maxLength: 200
        consequence_text:
          type: string
          minLength: 1
          maxLength: 500
    EconomicEventOutput:
      type: object
      additionalProperties: false
      required:
        - review_status
        - template_type
        - title
        - narrative
        - choices
        - progress_messages
      properties:
        review_status:
          type: string
          const: REVIEW_REQUIRED
        template_type:
          $ref: '#/components/schemas/EventTemplateType'
        title:
          type: string
          minLength: 1
          maxLength: 150
        narrative:
          type: string
          minLength: 1
          maxLength: 2000
        choices:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/EventChoice'
        progress_messages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 300
    QuizCategory:
      type: string
      enum: [ECONOMY, NONSENSE]
    QuizQuestionType:
      type: string
      enum: [MULTIPLE_CHOICE, OX]
    QuizDraftPayload:
      type: object
      additionalProperties: false
      required: [topic, learning_objectives, category, question_type, count]
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 200
        learning_objectives:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 300
        category:
          $ref: '#/components/schemas/QuizCategory'
        question_type:
          $ref: '#/components/schemas/QuizQuestionType'
        count:
          type: integer
          minimum: 1
          maximum: 30
    QuizDraftGenerationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CommonRequestFields'
        - type: object
          required: [payload]
          properties:
            payload:
              $ref: '#/components/schemas/QuizDraftPayload'
    QuizChoice:
      type: object
      additionalProperties: false
      required: [choice_key, text]
      properties:
        choice_key:
          type: string
          pattern: '^(?:[A-E]|O|X)$'
        text:
          type: string
          minLength: 1
          maxLength: 300
    QuizQuestionDraft:
      type: object
      additionalProperties: false
      required:
        - review_status
        - question_type
        - question
        - choices
        - correct_choice_key
        - explanation
        - age_appropriateness_tags
      properties:
        review_status:
          type: string
          const: REVIEW_REQUIRED
        question_type:
          $ref: '#/components/schemas/QuizQuestionType'
        question:
          type: string
          minLength: 1
          maxLength: 1000
        choices:
          type: array
          minItems: 2
          maxItems: 5
          items:
            $ref: '#/components/schemas/QuizChoice'
        correct_choice_key:
          type: string
          pattern: '^(?:[A-E]|O|X)$'
        explanation:
          type: string
          minLength: 1
          maxLength: 1000
        age_appropriateness_tags:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 50
    QuizDraftOutput:
      type: object
      additionalProperties: false
      required: [review_status, category, questions]
      properties:
        review_status:
          type: string
          const: REVIEW_REQUIRED
        category:
          $ref: '#/components/schemas/QuizCategory'
        questions:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/QuizQuestionDraft'
    Usage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
    ResponseMetadata:
      type: object
      required:
        - ai_run_id
        - schema_version
        - prompt_version
        - provider
        - model_id
        - safety_status
        - validation_codes
        - usage
      properties:
        ai_run_id:
          type: string
          format: uuid
        schema_version:
          type: string
          const: '1.0'
        prompt_version:
          type: string
          pattern: '^[a-z0-9-]+-v[1-9][0-9]*$'
        provider:
          type: string
          minLength: 1
          maxLength: 50
        model_id:
          type: string
          minLength: 1
          maxLength: 200
        safety_status:
          type: string
          const: PASSED
        validation_codes:
          type: array
          maxItems: 50
          items:
            type: string
        usage:
          $ref: '#/components/schemas/Usage'
    BalancingGenerationResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ResponseMetadata'
        - type: object
          required: [output]
          properties:
            output:
              $ref: '#/components/schemas/BalancingOutput'
    TeacherChatGenerationResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ResponseMetadata'
        - type: object
          required: [output]
          properties:
            output:
              $ref: '#/components/schemas/TeacherChatOutput'
    EconomicEventGenerationResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ResponseMetadata'
        - type: object
          required: [output]
          properties:
            output:
              $ref: '#/components/schemas/EconomicEventOutput'
    QuizDraftGenerationResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ResponseMetadata'
        - type: object
          required: [output]
          properties:
            output:
              $ref: '#/components/schemas/QuizDraftOutput'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, retryable, validation_codes]
      properties:
        code:
          type: string
          enum:
            - AI_INPUT_SCHEMA_INVALID
            - AI_SERVICE_SCOPE_VIOLATION
            - AI_RUN_CONTEXT_MISMATCH
            - AI_INSUFFICIENT_DATA
            - AI_OUTPUT_SCHEMA_INVALID
            - AI_OUTPUT_SAFETY_REJECTED
            - AI_PROVIDER_RATE_LIMITED
            - AI_PROVIDER_UNAVAILABLE
            - AI_DEADLINE_EXCEEDED
        message:
