openapi: 3.1.0
info:
  title: 이코빌리지 Spring-FastAPI 내부 AI API
  version: 1.2.0
  summary: Spring과 FastAPI 사이의 내부 AI 생성 계약
  description: |
    Spring 통합 API가 집계·권한·정책 범위를 확정한 뒤 FastAPI 생성 서비스에
    전달하는 내부 전용 계약이다. 이 API는 사용자 토큰과 학생 개인 데이터를 받지
    않으며 생성 결과를 직접 게시하거나 정책에 적용하지 않는다.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://ai-service:8000
    description: Container network
tags:
  - name: Internal AI Generations
    description: 검증된 입력만 받아 교사 검토용 AI 산출물을 생성하는 내부 작업
security:
  - internalServiceBearer: []
paths:
  /internal/v1/generations/balancing:
    post:
      tags: [Internal AI Generations]
      operationId: generateBalancingProposal
      summary: 설정 점검 또는 운영 지표에서 검증 가능한 설명과 제안을 생성한다.
      x-required-scope: ai:generate:balancing
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AiRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalancingGenerationRequest'
      responses:
        '200':
          description: 검증 가능한 구조화 생성 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancingGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/ProviderRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/generations/teacher-chat:
    post:
      tags: [Internal AI Generations]
      operationId: generateTeacherChatAnswer
      summary: 허용된 학급 집계 사실만 근거로 교사용 답변을 생성한다.
      x-required-scope: ai:generate:teacher-chat
      x-total-timeout-seconds: 20
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AiRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherChatGenerationRequest'
      responses:
        '200':
          description: 근거가 연결된 교사용 답변
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherChatGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/ProviderRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/generations/economic-event:
    post:
      tags: [Internal AI Generations]
      operationId: generateEconomicEventDraft
      summary: 규칙 엔진이 정한 효과를 설명하는 경제 이벤트 문구를 생성한다.
      x-required-scope: ai:generate:economic-event
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AiRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomicEventGenerationRequest'
      responses:
        '200':
          description: 교사 검토가 필요한 이벤트 문구 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicEventGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/ProviderRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /internal/v1/generations/quiz-draft:
    post:
      tags: [Internal AI Generations]
      operationId: generateQuizDraft
      summary: 학년과 학습목표에 맞는 REVIEW_REQUIRED 퀴즈 초안을 생성한다.
      description: >-
        경제·넌센스 객관식·OX 초안을 생성한다. 중복 문항·선택지, 숫자 정답 오류,
        학년 부적합·유해 표현은 검증 단계에서 전체 응답을 거부한다.
      x-required-scope: ai:generate:quiz-draft
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AiRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizDraftGenerationRequest'
      responses:
        '200':
          description: 교사 검토가 필요한 퀴즈 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizDraftGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/ProviderRateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
components:
  securitySchemes:
    internalServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: short-lived-service-token
      description: 기능별 ai:generate:* scope가 포함된 내부 서비스 토큰
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AiRunId:
      name: X-AI-Run-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 입력 계약 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 내부 서비스 scope 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: AI 실행 문맥 불일치
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: 데이터 부족 또는 생성 결과 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderRateLimited:
      description: 공급자 호출 제한
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: 공급자 일시 장애
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DeadlineExceeded:
      description: 전달된 절대 기한 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CommonRequestFields:
      type: object
      required:
        - ai_run_id
        - request_id
        - correlation_id
        - schema_version
        - prompt_version
        - attempt
        - deadline_at
        - locale
        - grade
      properties:
        ai_run_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        schema_version:
          type: string
          const: '1.2'
        prompt_version:
          type: string
          pattern: '^[a-z0-9-]+-v[1-9][0-9]*$'
        attempt:
          type: integer
          enum: [1, 2]
        deadline_at:
          type: string
          format: date-time
        locale:
          type: string
          const: ko-KR
        grade:
          type: integer
          enum: [4, 5, 6]
    Period:
      type: object
      additionalProperties: false
      required: [from, to, data_as_of]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        data_as_of:
          type: string
          format: date-time
    Sample:
      type: object
      additionalProperties: false
      required: [active_students, related_transactions, status]
      properties:
        active_students:
          type: integer
          minimum: 0
        related_transactions:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [SUFFICIENT, INSUFFICIENT]
    Metric:
      type: object
      additionalProperties: false
      required: [code, availability, value, unit, state, direction, unavailable_reason]
      properties:
        code:
          type: string
          enum:
            - LIQUID_MONEY_CHANGE_RATE_BPS
            - ISSUANCE_AMOUNT
            - RECOVERY_AMOUNT
            - ISSUANCE_RECOVERY_RATE_BPS
            - WALLET_AVERAGE_CHANGE_RATE_BPS
            - WALLET_MEDIAN_CHANGE_RATE_BPS
            - ASSET_CONCENTRATION_TOP20_BPS
            - CONSUMPTION_RATE_BPS
            - PRODUCT_SELL_THROUGH_RATE_BPS
            - PRODUCT_STOCKOUT_SHARE_BPS
            - FINANCIAL_PARTICIPATION_RATE_BPS
            - PAYMENT_MISS_RATE_BPS
            - INVESTMENT_PARTICIPATION_RATE_BPS
            - INVESTMENT_MEDIAN_RETURN_BPS
            - INVESTMENT_LOSS_PARTICIPANT_RATE_BPS
            - REWARD_ISSUANCE_SHARE_BPS
        value:
          type: [integer, 'null']
        previous_value:
          type: [integer, 'null']
        availability:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        unavailable_reason:
          type: [string, 'null']
          maxLength: 200
        unit:
          type: string
          enum: [AMOUNT, COUNT, RATE_BPS]
        state:
          type: string
          enum: [NORMAL, OBSERVE, WARN, UNAVAILABLE]
        direction:
          type: string
          enum: [LOW, NORMAL, HIGH, NOT_APPLICABLE]
        subject_label:
          type: [string, 'null']
          maxLength: 100
    AllowedAction:
      type: object
      additionalProperties: false
      required:
        - action_id
        - target_type
        - target_id
        - current_value
        - min_value
        - max_value
        - unit
      properties:
        action_id:
          type: string
          minLength: 1
          maxLength: 100
        target_type:
          type: string
          enum:
            - PRODUCT_PRICE
            - PRODUCT_STOCK
            - ACTIVITY_REWARD
            - GAME_REWARD
            - QUIZ_REWARD
            - TAX_RATE
            - INFLATION_RATE
            - DEPOSIT_RATE
            - SAVINGS_RATE
            - LOAN_RATE
        target_id:
          type: string
          format: uuid
        current_value:
          type: integer
          minimum: 0
        min_value:
          type: integer
          minimum: 0
        max_value:
          type: integer
          minimum: 0
        unit:
          type: string
          enum: [AMOUNT, COUNT, RATE_BPS]
        label:
          type: string
          minLength: 1
          maxLength: 100
    SetupContext:
      type: object
      additionalProperties: false
      required:
        - context_type
        - course_scale
        - expected_students
        - operation_period_days
        - active_modules
        - module_code
        - module_id
        - quiz_mode
      properties:
        context_type:
          type: string
          enum: [CLASSROOM_SETUP, MODULE_ACTIVATION, PRODUCT_DRAFT, QUIZ_SESSION_DRAFT]
        course_scale:
          type: string
          enum: [ONE_SHOT, ONE_WEEK, ONE_MONTH, ONE_SEMESTER]
        expected_students:
          type: integer
          minimum: 1
          maximum: 100
        operation_period_days:
          type: integer
          minimum: 1
          maximum: 365
        active_modules:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        module_code:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          description: MODULE_ACTIVATION에서만 필수인 대상 모듈 코드
        module_id:
          type: [string, 'null']
          format: uuid
          description: MODULE_ACTIVATION에서만 필수인 대상 모듈 UUID
        quiz_mode:
          type: [string, 'null']
          enum: [GAME, TEST, null]
    SetupCandidate:
      type: object
      additionalProperties: false
      required:
        - action_id
        - target_type
        - target_id
        - proposed_value
        - recommended_min_value
        - recommended_max_value
        - allowed_min_value
        - allowed_max_value
        - unit
        - reason_codes
        - label
      properties:
        action_id:
          type: string
          minLength: 1
          maxLength: 100
        target_type:
          type: string
          enum:
            - ROLE_SALARY
            - INCOME_TAX_RATE
            - DEPOSIT_RATE
            - LOAN_RATE
            - PRODUCT_PRICE
            - GAME_REWARD
        target_id:
          type: [string, 'null']
          format: uuid
        proposed_value:
          type: integer
          minimum: 0
        recommended_min_value:
          type: integer
          minimum: 0
        recommended_max_value:
          type: integer
          minimum: 0
        allowed_min_value:
          type: integer
          minimum: 0
        allowed_max_value:
          type: integer
          minimum: 0
        unit:
          type: string
          enum: [AMOUNT, COUNT, RATE_BPS]
        reason_codes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,79}$'
        label:
          type: string
          minLength: 1
          maxLength: 100
    PreflightCheck:
      type: object
      additionalProperties: false
      required: [check_id, severity, reason_code, subject_action_ids, message]
      properties:
        check_id:
          type: string
          minLength: 1
          maxLength: 100
        severity:
          type: string
          enum: [PASS, WARN, BLOCK]
        reason_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,79}$'
        subject_action_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
    SetupPrecheckPayload:
      type: object
      additionalProperties: false
      required: [context, candidates, checks]
      properties:
        context:
          $ref: '#/components/schemas/SetupContext'
        candidates:
          type: array
          maxItems: 30
          description: >-
            CLASSROOM_SETUP에는 수치 후보를 전달하지 않고 TEST 퀴즈에도 보상 후보를
            전달하지 않는다. MODULE_ACTIVATION 후보의 target_id는 context.module_id와 같아야
            하고 module_code와 target_type 조합도 일치해야 한다. PRODUCT_DRAFT와
            QUIZ_SESSION_DRAFT 후보에도 대상 UUID가 필요하다.
          items:
            $ref: '#/components/schemas/SetupCandidate'
        checks:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PreflightCheck'
    BalancingPayload:
      type: object
      additionalProperties: false
      required:
        - metric_version
        - threshold_version
        - period
        - previous_period
        - analysis_severity
        - sample
        - metrics
        - allowed_actions
      properties:
        metric_version:
          type: string
          const: economic-metrics-v1
        threshold_version:
          type: string
          const: economic-thresholds-v1
        period:
          $ref: '#/components/schemas/Period'
        previous_period:
          oneOf:
            - $ref: '#/components/schemas/Period'
            - type: 'null'
        analysis_severity:
          type: string
          enum: [NORMAL, OBSERVE, WARN]
        sample:
          $ref: '#/components/schemas/Sample'
        metrics:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Metric'
        allowed_actions:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AllowedAction'
    BalancingGenerationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CommonRequestFields'
        - type: object
          required: [analysis_mode, trigger_type, payload]
          properties:
            analysis_mode:
              type: string
              enum: [SETUP_PRECHECK, ON_DEMAND, AUTO_MONITOR]
            trigger_type:
              type: string
              enum: [TEACHER_REQUEST, AUTO_MONITOR]
            payload:
              oneOf:
                - $ref: '#/components/schemas/SetupPrecheckPayload'
                - $ref: '#/components/schemas/BalancingPayload'
    BalancingProposal:
      type: object
      additionalProperties: false
      required:
        - action_id
        - target_type
        - label
        - current_value
        - min_value
        - max_value
        - unit
        - proposed_value
        - evidence_metric_codes
        - rationale
        - expected_effect
        - side_effects
        - priority
      properties:
        action_id:
          type: string
          minLength: 1
          maxLength: 100
        target_type:
          type: string
          enum:
            - PRODUCT_PRICE
            - PRODUCT_STOCK
            - ACTIVITY_REWARD
            - GAME_REWARD
            - QUIZ_REWARD
            - TAX_RATE
            - INFLATION_RATE
            - DEPOSIT_RATE
            - SAVINGS_RATE
            - LOAN_RATE
        label:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        current_value:
          type: integer
          minimum: 0
        min_value:
          type: integer
          minimum: 0
        max_value:
          type: integer
          minimum: 0
        unit:
          type: string
          enum: [AMOUNT, COUNT, RATE_BPS]
        proposed_value:
          type: integer
          minimum: 0
        evidence_metric_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        rationale:
          type: string
          minLength: 1
          maxLength: 1000
        expected_effect:
          type: string
          minLength: 1
          maxLength: 1000
        side_effects:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 300
        priority:
          type: integer
          minimum: 1
          maximum: 100
    BalancingCause:
      type: object
      additionalProperties: false
      required: [text, evidence_metric_codes]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        evidence_metric_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    BalancingOutput:
      type: object
      additionalProperties: false
      required:
        - review_status
        - analysis_mode
        - trigger_type
        - analysis_severity
        - metric_version
        - threshold_version
        - period
        - previous_period
        - summary
        - evidence_metric_codes
        - causes
        - proposals
      properties:
        review_status:
          type: string
          const: REVIEW_REQUIRED
        analysis_mode:
          type: string
          enum: [ON_DEMAND, AUTO_MONITOR]
        trigger_type:
          type: string
          enum: [TEACHER_REQUEST, AUTO_MONITOR]
        analysis_severity:
          type: string
          enum: [NORMAL, OBSERVE, WARN]
        metric_version:
          type: string
          const: economic-metrics-v1
        threshold_version:
          type: string
          const: economic-thresholds-v1
        period:
          $ref: '#/components/schemas/Period'
        previous_period:
          oneOf:
            - $ref: '#/components/schemas/Period'
            - type: 'null'
        summary:
          type: string
          minLength: 1
          maxLength: 1500
        evidence_metric_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        causes:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/BalancingCause'
        proposals:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/BalancingProposal'
    SetupCandidateExplanation:
      type: object
      additionalProperties: false
      required:
        - action_id
        - target_type
        - label
        - proposed_value
        - recommended_min_value
        - recommended_max_value
        - allowed_min_value
        - allowed_max_value
        - unit
        - evidence_reason_codes
        - rationale
        - cautions
      properties:
        action_id:
          type: string
          minLength: 1
          maxLength: 100
        target_type:
          type: string
          enum:
            - ROLE_SALARY
            - INCOME_TAX_RATE
            - DEPOSIT_RATE
            - LOAN_RATE
            - PRODUCT_PRICE
            - GAME_REWARD
        label:
          type: string
          minLength: 1
          maxLength: 100
        proposed_value:
          type: integer
          minimum: 0
        recommended_min_value:
          type: integer
          minimum: 0
        recommended_max_value:
          type: integer
          minimum: 0
        allowed_min_value:
          type: integer
          minimum: 0
        allowed_max_value:
          type: integer
          minimum: 0
        unit:
          type: string
          enum: [AMOUNT, COUNT, RATE_BPS]
        evidence_reason_codes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]{1,79}$'
        rationale:
          type: string
          minLength: 1
          maxLength: 1000
        cautions:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 300
    PreflightCheckExplanation:
      type: object
      additionalProperties: false
      required:
        - check_id
        - severity
        - reason_code
        - subject_action_ids
        - explanation
        - correction_guidance
      properties:
        check_id:
          type: string
          minLength: 1
          maxLength: 100
        severity:
          type: string
          enum: [PASS, WARN, BLOCK]
        reason_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,79}$'
        subject_action_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
