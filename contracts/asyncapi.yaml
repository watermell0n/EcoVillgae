asyncapi: "3.1.0"
id: "urn:ecovillage:realtime-api"
info:
  title: "이코빌리지 Realtime WebSocket API"
  version: "0.1.0"
  description: "WEBSOCKET_SPEC.md의 논리 채널 10개와 도메인 이벤트 48개를 기계 판독 계약으로 고정합니다. 변경 명령은 HTTP로만 받고 WebSocket은 커밋된 상태를 최소 1회 전달합니다."
defaultContentType: "application/json"
servers:
  production:
    host: "api.ecovillage.kr"
    pathname: "/ws/v1"
    protocol: "wss"
    description: "운영 WebSocket Gateway"
    security:
      - $ref: "#/components/securitySchemes/realtimeTicket"
    bindings:
      ws:
        query:
          type: "object"
          required:
            - "ticket"
          properties:
            ticket:
              type: "string"
              minLength: 20
              description: "API-AUTH-007 또는 API-DSP-001에서 발급한 60초·1회용 티켓"
          additionalProperties: false
        bindingVersion: "0.1.0"
  local:
    host: "localhost:8080"
    pathname: "/ws/v1"
    protocol: "ws"
    description: "로컬 개발 WebSocket Gateway"
    security:
      - $ref: "#/components/securitySchemes/realtimeTicket"
channels:
  wsCls001:
    address: "/ws/v1"
    title: "WS-CLS-001"
    summary: "앱 모드, 학급 종료, 모듈, 정책 버전"
    description: "논리 구독 주소: `classrooms/{C}/lifecycle`.\n\n허용 역할: STU, OWN, COT.\n\n권한 조건: 학급 소속, PM-RBAC-001."
    x-channel-id: "WS-CLS-001"
    x-logical-address: "classrooms/{C}/lifecycle"
    messages:
      EvtCls001:
        $ref: "#/components/messages/EvtCls001"
      EvtCls002:
        $ref: "#/components/messages/EvtCls002"
      EvtMod001:
