          format: "uuid"
        resource_id:
          type: "string"
          format: "uuid"
        state_version:
          type: "integer"
          format: "int64"
          minimum: 0
        sequence:
          type: "integer"
          format: "int64"
          minimum: 1
        correlation_id:
          type: "string"
