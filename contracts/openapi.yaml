openapi: "3.1.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: "이코빌리지 Core HTTP API"
  version: "0.1.0"
  summary: "학생 앱, 교사용 앱·웹, 학교 관리자와 플랫폼 운영자가 사용하는 REST API"
  description: "HTTP_API_SPEC.md의 107개 작업을 기계 판독 계약으로 고정한 기준선입니다. 모든 변경은 멱등성 키를 사용하고, 금액·세금·잔액·권한은 서버가 다시 계산합니다."
  license:
    name: "Proprietary"
    identifier: "LicenseRef-Proprietary"
servers:
  - url: "https://api.ecovillage.kr/api/v1"
    description: "운영 환경 예시"
  - url: "https://api.dev.ecovillage.kr/api/v1"
    description: "개발 환경 예시"
