components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "학생·교사용 앱과 내부 서비스의 짧은 수명 액세스 토큰"
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "ECOVILLAGE_SESSION"
      description: "교사·관리자 웹의 HttpOnly·Secure 세션 쿠키"
    refreshCookie:
      type: "apiKey"
      in: "cookie"
      name: "ECOVILLAGE_REFRESH"
      description: "교사·관리자 웹의 회전형 갱신 토큰"
    refreshHeader:
      type: "apiKey"
      in: "header"
      name: "X-Refresh-Token"
      description: "Expo SecureStore에서 읽어 전송하는 학생·교사용 앱의 회전형 갱신 토큰"
    displayBearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "Opaque"
      description: "교사가 발급한 단기·단일 활동 공용 화면 토큰"
  parameters:
    XCorrelationId:
      name: "X-Correlation-Id"
      in: "header"
      required: false
      description: "분산 추적 ID. 생략하면 게이트웨이가 생성합니다."
      schema:
        type: "string"
        format: "uuid"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "사용자 행동마다 새로 생성하는 UUID. 같은 본문의 안전한 재시도에 재사용합니다."
      schema:
        type: "string"
        format: "uuid"
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      schema:
        type: "string"
    Limit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    ClassroomIdPath:
      name: "classroom_id"
      in: "path"
      required: true
      description: "classroom_id 식별자"
      schema:
        type: "string"
        format: "uuid"
    StudentIdPath:
      name: "student_id"
      in: "path"
      required: true
      description: "student_id 식별자"
      schema:
        type: "string"
        format: "uuid"
    ModuleCodePath:
      name: "module_code"
      in: "path"
      required: true
      description: "module_code 식별자"
      schema:
        type: "string"
    ResourceIdPath:
      name: "resource_id"
      in: "path"
      required: true
      description: "resource_id 식별자"
      schema:
        type: "string"
        format: "uuid"
    InstallmentIdPath:
      name: "installment_id"
      in: "path"
      required: true
      description: "installment_id 식별자"
      schema:
        type: "string"
        format: "uuid"
    SchoolIdPath:
      name: "school_id"
      in: "path"
      required: true
      description: "school_id 식별자"
      schema:
        type: "string"
        format: "uuid"
    TeacherIdPath:
      name: "teacher_id"
      in: "path"
      required: true
      description: "teacher_id 식별자"
      schema:
        type: "string"
        format: "uuid"
    DisplaySessionIdPath:
      name: "display_session_id"
      in: "path"
      required: true
      description: "display_session_id 식별자"
      schema:
        type: "string"
        format: "uuid"
    OperationIdPath:
      name: "operation_id"
      in: "path"
      required: true
      description: "operation_id 식별자"
      schema:
        type: "string"
        format: "uuid"
  schemas:
    MutationContext:
      type: "object"
      properties:
        expected_state_version:
          type: "integer"
          format: "int64"
          minimum: 0
        screen_id:
          type: "string"
          pattern: "^SCR-[A-Z]+-\\d{3}$"
        ui_action_id:
          type: "string"
          pattern: "^UIA-[A-Z]+-\\d{3}$"
        client_occurred_at:
          type: "string"
          format: "date-time"
      additionalProperties: true
    StudentSessionRequest:
      type: "object"
      required:
        - "classroom_code"
        - "attendance_number"
        - "nickname"
        - "password"
        - "device_id"
      properties:
        classroom_code:
          type: "string"
          minLength: 8
          maxLength: 8
          pattern: "^[A-HJ-KM-NP-Za-hj-km-np-z2-9]{8}$"
          description: "앞뒤 공백 제거·영문 대문자 정규화 후 8자 학급 코드"
        attendance_number:
          type: "integer"
          minimum: 1
        nickname:
          type: "string"
          minLength: 1
          maxLength: 40
        password:
          type: "string"
          format: "password"
          minLength: 8
          writeOnly: true
        device_id:
          type: "string"
          format: "uuid"
      additionalProperties: false
    Period:
      type: "object"
      required:
        - "from"
        - "to"
      properties:
        from:
          type: "string"
          format: "date-time"
        to:
          type: "string"
          format: "date-time"
      additionalProperties: false
    Meta:
      type: "object"
      required:
        - "request_id"
        - "correlation_id"
        - "server_time"
      properties:
        request_id:
          type: "string"
          format: "uuid"
        correlation_id:
          type: "string"
          format: "uuid"
        server_time:
          type: "string"
          format: "date-time"
        event_sequence:
          type: "integer"
          format: "int64"
          minimum: 0
        page:
          $ref: "#/components/schemas/PageMeta"
      additionalProperties: false
    PageMeta:
      type: "object"
      required:
        - "has_more"
      properties:
        next_cursor:
          type:
            - "string"
            - "null"
        has_more:
          type: "boolean"
      additionalProperties: false
    SuccessResponse:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type:
            - "object"
            - "array"
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/Meta"
      additionalProperties: false
    AsyncOperationAcceptedResponse:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "object"
          required:
            - "operation_id"
            - "status"
            - "status_url"
          properties:
            operation_id:
              type: "string"
              format: "uuid"
            status:
              type: "string"
              enum:
                - "QUEUED"
                - "RUNNING"
            status_url:
              type: "string"
              format: "uri-reference"
          additionalProperties: false
        meta:
          $ref: "#/components/schemas/Meta"
      additionalProperties: false
    ErrorDetail:
      type: "object"
      required:
        - "reason"
      properties:
        field:
          type: "string"
        reason:
          type: "string"
        current_value: true
      additionalProperties: false
    ErrorResponse:
      type: "object"
      required:
        - "error"
        - "meta"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
            - "retryable"
          properties:
            code:
              type: "string"
              pattern: "^[A-Z][A-Z0-9_]+$"
            message:
              type: "string"
            retryable:
              type: "boolean"
            details:
              type: "array"
              items:
                $ref: "#/components/schemas/ErrorDetail"
          additionalProperties: false
        meta:
          $ref: "#/components/schemas/Meta"
      additionalProperties: false
  responses:
    Success:
      description: "성공"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
    Accepted:
      description: "비동기 작업 접수"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AsyncOperationAcceptedResponse"
    BadRequest:
      description: "요청 형식 또는 필수 입력 오류"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "인증 필요 또는 세션 만료"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "역할·소속·모듈·앱 모드 정책 위반"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "리소스가 없거나 접근 범위 밖"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "멱등성·버전·상태 전이 충돌"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: "잔액·재고·한도·정책 조건 불충족"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: "요청 또는 AI 사용 한도 초과"
      headers:
        Retry-After:
          description: "재시도까지 기다릴 초"
          schema:
            type: "integer"
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "내부 처리 오류"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: "의존 서비스 또는 비동기 큐 사용 불가"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
