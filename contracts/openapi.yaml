paths:
  /auth/student-sessions:
    post:
      operationId: "apiAuth001"
      x-api-id: "API-AUTH-001"
      x-implementation-status: "mvp-contract"
      x-schema-closure: "strict"
      x-storage-targets:
        - "classrooms"
        - "classroom_students"
        - "student_credentials"
        - "device_links"
        - "student_sessions"
      x-ui-action-ids:
        - "UIA-AUTH-001"
      x-roles:
        - "인증 전 STU"
      x-permission-ids:
        - "PM-AUTH-001"
      x-state-machine-ids: []
      x-rtm-ids:
        - "AUTH-001"
        - "AUTH-003"
        - "AUTH-005"
        - "AUTH-007"
      tags:
        - "Authentication"
      summary: "classroom_code, attendance_number, nickname, password, device_id → 토큰, 학생 세션, 유효 진입 화면"
      description: "사람이 검토하는 원문 기준: `API-AUTH-001` in `docs/HTTP_API_SPEC.md`.\n\n허용 역할: 인증 전 STU.\n\n핵심 계약: classroom_code, attendance_number, nickname, password, device_id → 토큰, 학생 세션, 유효 진입 화면."
      security: []
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        201:
          description: "MVP 작업별 명시적 성공 응답"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "access_token"
                      - "refresh_token"
                      - "expires_at"
                      - "classroom_id"
                      - "student_id"
                      - "role"
                    properties:
                      access_token:
                        type: "string"
                        readOnly: true
                        x-sensitive: true
                      refresh_token:
                        type: "string"
                        readOnly: true
                        x-sensitive: true
                      expires_at:
                        type: "string"
                        format: "date-time"
                      classroom_id:
                        type: "string"
                        format: "uuid"
                      student_id:
                        type: "string"
                        format: "uuid"
                      role:
                        type: "string"
                        enum:
                          - "STU"
                    additionalProperties: false
                  meta:
                    $ref: "#/components/schemas/Meta"
                additionalProperties: false
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          $ref: "#/components/responses/Conflict"
        422:
          $ref: "#/components/responses/UnprocessableEntity"
        429:
          $ref: "#/components/responses/TooManyRequests"
        500:
          $ref: "#/components/responses/InternalError"
        503:
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentSessionRequest"
