    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "ECOVILLAGE_SESSION"
      description: "교사·관리자 웹의 HttpOnly·Secure 세션 쿠키"
    refreshCookie:
      type: "apiKey"
      in: "cookie"
      name: "ECOVILLAGE_REFRESH"
      description: "교사·관리자 웹의 회전형 갱신 토큰"
    refreshHeader:
      type: "apiKey"
      in: "header"
      name: "X-Refresh-Token"
      description: "Expo SecureStore에서 읽어 전송하는 학생·교사용 앱의 회전형 갱신 토큰"
    displayBearer:
      type: "http"
      scheme: "bearer"
