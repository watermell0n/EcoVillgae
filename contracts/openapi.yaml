          $ref: "#/components/schemas/PageMeta"
      additionalProperties: false
    PageMeta:
      type: "object"
      required:
        - "has_more"
      properties:
        next_cursor:
          type:
            - "string"
            - "null"
        has_more:
          type: "boolean"
      additionalProperties: false
    SuccessResponse:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type:
            - "object"
            - "array"
          additionalProperties: true
        meta:
          $ref: "#/components/schemas/Meta"
      additionalProperties: false
    AsyncOperationAcceptedResponse:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "object"
          required:
            - "operation_id"
            - "status"
            - "status_url"
          properties:
            operation_id:
              type: "string"
              format: "uuid"
            status:
              type: "string"
              enum:
                - "QUEUED"
                - "RUNNING"
            status_url:
              type: "string"
              format: "uri-reference"
          additionalProperties: false
        meta:
          $ref: "#/components/schemas/Meta"
      additionalProperties: false
    ErrorDetail:
      type: "object"
      required:
        - "reason"
      properties:
        field:
          type: "string"
        reason:
          type: "string"
        current_value: true
      additionalProperties: false
    ErrorResponse:
      type: "object"
      required:
        - "error"
        - "meta"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
            - "retryable"
          properties:
            code:
              type: "string"
              pattern: "^[A-Z][A-Z0-9_]+$"
            message:
              type: "string"
            retryable:
              type: "boolean"
            details:
              type: "array"
              items:
                $ref: "#/components/schemas/ErrorDetail"
          additionalProperties: false
        meta:
          $ref: "#/components/schemas/Meta"
      additionalProperties: false
  responses:
    Success:
      description: "성공"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
    Accepted:
      description: "비동기 작업 접수"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AsyncOperationAcceptedResponse"
    BadRequest:
      description: "요청 형식 또는 필수 입력 오류"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "인증 필요 또는 세션 만료"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "역할·소속·모듈·앱 모드 정책 위반"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "리소스가 없거나 접근 범위 밖"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "멱등성·버전·상태 전이 충돌"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: "잔액·재고·한도·정책 조건 불충족"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: "요청 또는 AI 사용 한도 초과"
      headers:
        Retry-After:
          description: "재시도까지 기다릴 초"
          schema:
            type: "integer"
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "내부 처리 오류"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: "의존 서비스 또는 비동기 큐 사용 불가"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
