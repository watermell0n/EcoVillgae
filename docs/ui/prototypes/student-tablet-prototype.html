<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이코빌리지 학생 태블릿 프로토타입</title>
  <style>
    :root {
      --ink: #243042;
      --muted: #6f8198;
      --line: #cfe8ef;
      --panel: rgba(255,255,255,0.92);
      --white: #fff;
      --blue: #75bdf4;
      --blue-deep: #2f76b8;
      --green: #74c895;
      --green-soft: #dff6e8;
      --yellow: #ffe39a;
      --yellow-soft: #fff5d8;
      --red: #ee7777;
      --red-soft: #ffe8e8;
      --purple: #b7a9f6;
      --shadow: 0 14px 34px rgba(45, 77, 87, 0.08);
      --radius: 18px;
      --soft: 14px;
      font-family: "Pretendard", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: auto;
      background:
        radial-gradient(circle at 20% 0%, rgba(187, 226, 255, 0.72), transparent 34%),
        linear-gradient(135deg, #d7efff 0%, #d7f3e8 48%, #f8f5c8 100%);
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .tablet {
      height: 100vh;
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      padding: 0;
    }

    .nav {
      background: #2f3b4d;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      overflow: hidden;
    }

    .home-mark {
      min-width: 118px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 9px;
      background: rgba(255,255,255,0.13);
      font-size: 15px;
      font-weight: 950;
      color: #fff;
    }

    .nav-list {
      padding: 0;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow: auto;
    }

    .nav-btn {
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: rgba(255,255,255,0.12);
      color: #eef6ff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 14px;
      white-space: nowrap;
    }

    .nav-btn.active,
    .nav-btn:hover {
      background: #ed8a44;
      color: #fff;
      box-shadow: none;
    }

    .nav-btn .icon {
      width: auto;
      height: auto;
      display: inline;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font-size: 13px;
      font-weight: 950;
      line-height: 1;
    }

    .nav-btn span:last-child {
      font-size: 12px;
      font-weight: 800;
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 76px minmax(0, 1fr);
      gap: 0;
    }

    .topbar {
      background: linear-gradient(90deg, rgba(190,226,247,0.9), rgba(200,244,218,0.88));
      border: 0;
      border-bottom: 2px solid rgba(255,255,255,0.65);
      border-radius: 0;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      min-width: 0;
    }

    .student {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 9px;
      background: rgba(255,255,255,0.42);
      display: grid;
      place-items: center;
      font-size: 26px;
      box-shadow: inset 0 -4px 0 rgba(255,255,255,0.38);
    }

    .student strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
    }

    .student span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .chips {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.72);
      color: #316fa7;
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .chip.green { background: var(--green-soft); color: #2f7e4a; }
    .chip.yellow { background: var(--yellow-soft); color: #886000; }
    .chip.red { background: var(--red-soft); color: #a33b3b; }

    .stage {
      min-width: 0;
      min-height: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.32), rgba(255,255,255,0.05)),
        transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: 34px 42px;
      overflow: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 26px;
    }

    .stage.full {
      grid-template-columns: minmax(0, 1fr);
    }

    .stage.full > .panel {
      display: none;
    }

    .content {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 15px;
    }

    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 34px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
      font-weight: 650;
    }

    .screen-key {
      color: #7f91a6;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .body {
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .village-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      padding-top: 12px;
    }

    .village-card {
      min-height: 218px;
      position: relative;
      display: grid;
      place-items: center;
      text-align: center;
      border: 2px solid rgba(207,232,239,0.95);
      border-radius: 22px;
      background: rgba(255,255,255,0.72);
      box-shadow: 0 18px 34px rgba(48, 84, 92, 0.08);
      overflow: hidden;
    }

    .village-card.orange { border-color: #f4c9af; }
    .village-card.purple { border-color: #c8bcff; }
    .village-card.red { border-color: #f4c3c2; }
    .village-card.green { border-color: #bfe7ca; }
    .village-card.yellow { border-color: #f5dc85; }
    .village-card.dim {
      opacity: 0.52;
      filter: grayscale(0.1);
    }

    .module-badge {
      position: absolute;
      right: 18px;
      top: 16px;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ec6f70;
      color: #fff;
      font-size: 13px;
      font-weight: 950;
    }

    .village-icon {
      display: block;
      margin-bottom: 22px;
      font-size: 52px;
      line-height: 1;
    }

    .village-card strong {
      display: block;
      margin-bottom: 8px;
      font-size: 24px;
      line-height: 1.2;
    }

    .village-card span {
      display: block;
      color: #7b8da4;
      font-size: 17px;
      font-weight: 850;
    }

    .enter-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 126px;
      height: 36px;
      margin-top: 20px;
      border-radius: 999px;
      background: #ed8541;
      color: #fff;
      font-size: 17px;
      font-weight: 950;
    }

    .enter-pill.purple { background: #7d55ef; }
    .enter-pill.green { background: #5fad67; }
    .enter-pill.red { background: #e86f70; }

    .paystub-view {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.92fr);
      gap: 24px;
      align-items: stretch;
    }

    .receipt-card,
    .info-stack > section {
      background: rgba(255,255,255,0.88);
      border: 2px solid rgba(241,202,182,0.95);
      border-radius: 22px;
      box-shadow: 0 18px 34px rgba(48, 84, 92, 0.08);
      overflow: hidden;
    }

    .receipt-head {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 34px;
      background: #ed8541;
      color: #fff;
    }

    .receipt-head strong {
      display: block;
      font-size: 25px;
    }

    .receipt-body {
      display: grid;
      gap: 16px;
      padding: 26px 34px 34px;
      background: #fffdf4;
    }

    .receipt-row {
      min-height: 64px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      border-radius: 14px;
      background: rgba(248,251,238,0.9);
      font-size: 19px;
      font-weight: 950;
    }

    .receipt-row.tax {
      background: #fff7f2;
      border: 1px solid #f4c9c1;
      color: #e26767;
    }

    .receipt-total {
      margin-top: 8px;
      padding: 26px;
      border: 3px solid #65b66f;
      border-radius: 18px;
      background: #f4fff1;
      text-align: center;
      color: #5fad67;
      font-size: 50px;
      font-weight: 950;
    }

    .receipt-total span {
      display: block;
      color: #7b8da4;
      font-size: 15px;
      margin-top: 6px;
    }

    .info-stack {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .info-stack > section {
      border-color: #c9e3d0;
      padding: 24px 28px;
    }

    .flow-line {
      min-height: 110px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      text-align: center;
    }

    .flow-box {
      border-radius: 14px;
      padding: 20px;
      background: #f5f7fb;
      font-size: 26px;
      font-weight: 950;
    }

    .flow-box.good {
      background: #f0fff2;
      border: 2px solid #b8e0c0;
      color: #5fad67;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: rgba(255,255,255,0.82);
      border: 2px solid rgba(207,232,239,0.95);
      border-radius: 20px;
      padding: 22px;
      min-height: 168px;
      display: grid;
      align-content: start;
      gap: 10px;
      box-shadow: 0 14px 28px rgba(48, 84, 92, 0.07);
    }

    .open-section {
      display: grid;
      gap: 22px;
      align-content: start;
    }

    .hero-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 4px 2px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.5);
      text-align: center;
    }

    .hero-strip h2 {
      margin: 0 0 8px;
      font-size: 36px;
      letter-spacing: 0;
    }

    .hero-strip p {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
      font-weight: 700;
    }

    .hero-balance {
      text-align: right;
      color: #357fb3;
      font-size: 18px;
      font-weight: 950;
      white-space: nowrap;
    }

    .hero-balance strong {
      display: block;
      margin-top: 4px;
      color: var(--ink);
      font-size: 36px;
      letter-spacing: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: var(--ink);
      font-size: 19px;
      font-weight: 950;
    }

    .section-title span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .plain-list {
      display: grid;
      gap: 0;
      background: rgba(255,255,255,0.5);
      border-top: 1px solid rgba(64,139,197,0.18);
      border-bottom: 1px solid rgba(64,139,197,0.18);
    }

    .plain-row {
      min-height: 68px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 13px 2px;
      border-bottom: 1px solid rgba(64,139,197,0.14);
    }

    .plain-row:last-child {
      border-bottom: 0;
    }

    .plain-row strong {
      display: block;
      font-size: 18px;
    }

    .plain-row span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .quick-action {
      min-height: 118px;
      display: grid;
      align-content: start;
      gap: 8px;
      padding: 15px;
      border: 2px solid rgba(185,216,239,0.9);
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
    }

    .quick-action strong {
      font-size: 18px;
    }

    .quick-action span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
    }

    .card.selected {
      border-color: #7cbdf4;
      box-shadow: 0 0 0 4px rgba(117,189,244,0.15);
    }

    .card h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 650;
    }

    .price {
      margin-top: auto;
      font-size: 24px;
      font-weight: 950;
      color: #24465e;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row {
      min-height: 66px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      background: rgba(255,255,255,0.82);
      border: 2px solid rgba(207,232,239,0.9);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .row strong {
      display: block;
      font-size: 17px;
    }

    .row span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .amount {
      font-size: 21px;
      font-weight: 950;
      white-space: nowrap;
    }

    .amount.plus { color: #23834b; }
    .amount.minus { color: #c25151; }

    .panel {
      min-height: 0;
      background: rgba(255,255,255,0.64);
      border: 0;
      border-radius: 22px;
      padding: 18px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
    }

    .panel h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .mini-list {
      display: grid;
      gap: 10px;
      align-content: start;
      overflow: auto;
    }

    .mini {
      background: transparent;
      border: 0;
      border-bottom: 1px solid rgba(36,48,66,0.09);
      border-radius: var(--radius);
      padding: 4px 0 12px;
    }

    .mini:last-child {
      border-bottom: 0;
    }

    .mini strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .mini span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      font-weight: 650;
    }

    .footer {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #c4d4e6;
    }

    .dot.active { background: var(--blue); }

    .actions {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .btn {
      min-height: 52px;
      border: 0;
      border-radius: 999px;
      padding: 0 19px;
      background: #eaf5ff;
      color: #316fa7;
      font-size: 16px;
      font-weight: 950;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08), 0 8px 16px rgba(48,84,92,0.06);
      white-space: nowrap;
    }

    .btn.primary {
      background: #ed8541;
      color: #fff;
    }

    .btn.warn {
      background: var(--yellow);
      color: #735000;
    }

    .btn.danger {
      background: var(--red-soft);
      color: #a33b3b;
    }

    .form {
      max-width: 620px;
      display: grid;
      gap: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #51667c;
      font-size: 15px;
      font-weight: 900;
    }

    .input, .select {
      width: 100%;
      height: 58px;
      border: 1px solid #cfe1f3;
      border-radius: var(--radius);
      background: #f4f9ff;
      padding: 0 16px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
      outline: 0;
    }

    .hero {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 10%, rgba(223,246,232,0.95), transparent 58%),
        rgba(255,255,255,0.68);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
    }

    .hero .big {
      display: inline-grid;
      place-items: center;
      min-width: 72px;
      height: 40px;
      margin-bottom: 14px;
      padding: 0 14px;
      border-radius: 999px;
      background: #eaf7ff;
      color: #2f76b8;
      font-size: 17px;
      font-weight: 950;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: 0;
    }

    .hero p {
      margin: 0 auto 20px;
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      font-weight: 650;
    }

    .character {
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(0deg, #d7f1c4 0 22%, transparent 23%),
        linear-gradient(180deg, #effaff, #ffffff);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 0 rgba(69, 126, 170, 0.12);
    }

    .char-body {
      width: 150px;
      height: 170px;
      border-radius: 4px;
      border: 2px dashed rgba(109, 145, 131, 0.36);
      background: rgba(255,255,255,0.34);
      display: grid;
      place-items: center;
      color: rgba(64, 82, 76, 0.38);
      font-size: 16px;
      font-weight: 950;
      image-rendering: pixelated;
    }

    .shop-layout {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 18px;
    }

    .character-panel,
    .shop-panel {
      min-height: 0;
      background: #f8fcff;
      border: 2px solid #b9d8ef;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 5px 0 rgba(69, 126, 170, 0.16);
    }

    .character-panel {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .character-stage {
      display: grid;
      place-items: center;
      padding: 22px 22px 18px;
      background:
        linear-gradient(0deg, #d7f1c4 0 20%, transparent 21%),
        linear-gradient(180deg, #eaf8ff, #ffffff 58%, #f7fff0);
    }

    .avatar-preview {
      width: min(100%, 250px);
      height: 260px;
      display: grid;
      place-items: center;
      position: relative;
    }

    .avatar-preview::before {
      content: "";
      position: absolute;
      bottom: 18px;
      width: 154px;
      height: 18px;
      border-radius: 0;
      background: rgba(65, 121, 90, 0.14);
    }

    .asset-slot {
      width: 190px;
      height: 214px;
      position: relative;
      display: grid;
      place-items: center;
      color: rgba(47, 118, 184, 0.42);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
      image-rendering: pixelated;
    }

    .asset-slot::before {
      content: "";
      position: absolute;
      inset: 8px 12px 6px;
      border: 2px dashed rgba(78, 145, 194, 0.38);
      border-radius: 4px;
      background: rgba(255,255,255,0.24);
    }

    .asset-slot span {
      position: relative;
      z-index: 1;
      line-height: 1.5;
    }

    .asset-slot img,
    .asset-thumb img {
      position: relative;
      z-index: 1;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .selected-item {
      margin: 0 18px 12px;
      padding: 14px;
      display: grid;

      top: 50%;

      height: 1px;

    function progressFor() {
      const index = screens.findIndex((screen) => screen.id === activeId);
      document.getElementById("progress").innerHTML = `
        <span>${index + 1} / ${screens.length}</span>
        ${screens.map((screen) => `<span class="dot ${screen.id === activeId ? "active" : ""}"></span>`).join("")}
      `;
    }

    function openScreen(id) {
      activeId = id;
      render();
    }

    function render() {
      const screen = screens.find((item) => item.id === activeId) || screens[0];
      const stage = document.querySelector(".stage");
      stage.classList.toggle("full", ["home", "paystub", "profile", "inventory", "preview"].includes(screen.type));
      navHTML();
      document.getElementById("title").textContent = screen.title;
      document.getElementById("desc").textContent = screen.desc;
      document.getElementById("key").textContent = screen.id;
      document.getElementById("body").innerHTML = bodyFor(screen.type);
      sideFor(screen);
      actionsFor(screen);
      progressFor();
    }

    render();
