<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이코빌리지 교사 UI Prototype 178-185</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #72819a;
      --line: #d9e5f5;
      --panel: rgba(255, 255, 255, 0.94);
      --panel-solid: #ffffff;
      --blue: #7dbef5;
      --blue-dark: #3578bd;
      --green: #7ccf9a;
      --mint: #d7f4e4;
      --yellow: #ffe6a6;
      --red: #f07c7c;
      --lavender: #d9d0ff;
      --shadow: 0 18px 50px rgba(83, 122, 152, 0.22);
      --radius: 8px;
      --soft-radius: 18px;
      font-family: "Pretendard", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(217, 243, 255, 0.88), rgba(247, 255, 221, 0.92)),
        url("./ecovillage-background-1280x800-v2.png") center bottom / cover no-repeat;
      overflow: hidden;
    }

    button, input, select {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      padding: 18px;
      gap: 16px;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(199, 221, 241, 0.9);
      border-radius: var(--soft-radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .brand {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #bee7ff, #c7f0cf);
      box-shadow: inset 0 -4px 0 rgba(255, 255, 255, 0.55);
      font-size: 24px;
    }

    .brand h1 {
      margin: 10px 0 4px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .screen-list {
      padding: 12px;
      overflow: auto;
      min-height: 0;
    }

    .group-label {
      margin: 14px 6px 6px;
      color: #64748b;
      font-size: 12px;
      font-weight: 800;
    }

    .screen-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin: 5px 0;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: #334155;
      text-align: left;
      cursor: pointer;
    }

    .screen-button:hover,
    .screen-button.active {
      background: #eef8ff;
      border-color: #bfddfb;
    }

    .screen-button.active {
      color: var(--blue-dark);
      font-weight: 800;
    }

    .screen-no {
      width: 58px;
      flex: 0 0 58px;
      color: #64748b;
      font-size: 12px;
      font-weight: 800;
    }

    .screen-title {
      min-width: 0;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: 68px minmax(0, 1fr);
      gap: 14px;
    }

    .topbar {
      background: var(--panel);
      border: 1px solid rgba(199, 221, 241, 0.9);
      border-radius: var(--soft-radius);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .class-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #edf7ff;
      color: #326899;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .chip.green {
      background: var(--mint);
      color: #2f7d4b;
    }

    .chip.yellow {
      background: #fff3c9;
      color: #8a6500;
    }

    .chip.red {
      background: #ffe5e5;
      color: #a33b3b;
    }

    .workspace {
      min-height: 0;
      background: var(--panel);
      border: 1px solid rgba(199, 221, 241, 0.9);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      overflow: hidden;
    }

    .content {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .header h2 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 15px;
    }

    .primary-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: var(--radius);
      background: #e7f2ff;
      color: #2f6798;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.05);
      white-space: nowrap;
    }

    .btn.primary {
      background: linear-gradient(135deg, #89ccff, #8fe0b0);
      color: #143450;
    }

    .btn.warn {
      background: #ffe3a3;
      color: #6f4b00;
    }

    .btn.danger {
      background: #ffe3e3;
      color: #963737;
    }

    .board {
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .hero-panel,
    .form-panel,
    .table-panel,
    .timeline-panel {
      background: var(--panel-solid);
      border: 1px solid var(--line);
      border-radius: var(--soft-radius);
      padding: 18px;
    }

    .hero-panel {
      min-height: 340px;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(215, 244, 228, 0.9), transparent 55%),
        #fff;
    }

    .hero-icon {
      font-size: 62px;
      margin-bottom: 10px;
    }

    .hero-panel h3 {
      margin: 0 0 10px;
      font-size: 30px;
      letter-spacing: 0;
    }

    .hero-panel p {
      margin: 0 auto 20px;
      max-width: 480px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 17px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      background: #fbfdff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
      letter-spacing: 0;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }

    .metric {
      font-size: 30px;
      font-weight: 900;
      margin-top: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #42526b;
      font-size: 13px;
      font-weight: 800;
    }

    .input,
    .select {
      width: 100%;
      height: 48px;
      border: 1px solid #cfe0f5;
      border-radius: var(--radius);
      background: #f3f9ff;
      padding: 0 14px;
      color: #334155;
      outline: none;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: var(--radius);
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 12px 10px;
      border-bottom: 1px solid #e6eef8;
      text-align: left;
      vertical-align: middle;
    }

    .table th {
      color: #52637a;
      font-size: 12px;
      background: #f3f8fe;
    }

    .table tr:last-child td {
      border-bottom: 0;
    }

    .summary {
      min-width: 0;
      min-height: 0;
      background: #fbfdff;
      border: 1px solid var(--line);
      border-radius: var(--soft-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .summary h3 {
      margin: 0 0 12px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .summary-list {
      display: grid;
      gap: 10px;
      overflow: auto;
      padding-right: 4px;
    }

    .summary-item {
      border: 1px solid #e4edf8;
      border-radius: var(--radius);
      padding: 11px;
      background: #ffffff;
    }

    .summary-item strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .summary-item span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .stepper {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .step {
      padding: 8px 11px;
      border-radius: 999px;
      background: #eef8ff;
      color: #3c6e9d;
      font-size: 12px;
      font-weight: 800;
    }

    .step.active {
      background: var(--mint);
      color: #2f7d4b;
    }

    .mobile-note {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: #fff3c9;
      color: #755600;
      font-size: 13px;
      font-weight: 800;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
      }

      .sidebar {
        max-height: 330px;
      }

      .main {
        grid-template-rows: auto auto;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .grid,
      .grid.two,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        min-height: 68px;
        align-items: flex-start;
        flex-direction: column;
        padding: 14px;
      }

      .mobile-note {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">

    <main class="main">

          <header class="header">
            <div>
              <h2 id="screenTitle"></h2>

            <div class="primary-actions" id="actions"></div>

          <div class="board" id="board"></div>

        <aside class="summary">
          <h3>화면 설계 체크</h3>
          <div class="summary-list" id="summary"></div>
        </aside>
      </section>
    </main>
  </div>

            summary: ["승인 대기", "거래 상세", "반려 사유"]

    const screens = groups.flatMap((group) => group.screens.map((screen) => ({ ...screen, group: group.label })));
    let currentId = screens[0].id;

    const screenList = document.getElementById("screenList");
    const screenTitle = document.getElementById("screenTitle");
    const screenPurpose = document.getElementById("screenPurpose");
    const actions = document.getElementById("actions");
    const board = document.getElementById("board");
    const summary = document.getElementById("summary");

    function renderList() {
      screenList.innerHTML = "";
      groups.forEach((group) => {
        const label = document.createElement("div");
        label.className = "group-label";
        label.textContent = group.label;
        screenList.appendChild(label);

        group.screens.forEach((screen) => {
          const button = document.createElement("button");
          button.className = `screen-button ${screen.id === currentId ? "active" : ""}`;
          button.type = "button";
          button.innerHTML = `<span class="screen-no">${screen.id}</span><span class="screen-title">${screen.title}</span>`;
          button.addEventListener("click", () => {
            currentId = screen.id;
            render();
          });
          screenList.appendChild(button);
        });
      });
    }

    function renderActions(screen) {
      actions.innerHTML = "";
      (screen.actions || []).forEach((label, index) => {
        const button = document.createElement("button");
        button.className = `btn ${index === 0 ? "primary" : ""}`;
        button.type = "button";
        button.textContent = label;
        actions.appendChild(button);
      });
    }

    function renderSteps(screen) {
      if (!screen.steps) return "";
      return `<div class="stepper">${screen.steps.map((step, index) => `<span class="step ${index === 0 ? "active" : ""}">${step}</span>`).join("")}</div>`;
    }

    function renderBoard(screen) {
      const steps = renderSteps(screen);

      if (screen.type === "hero") {
        return `${steps}<section class="hero-panel">
          <div>
            <div class="hero-icon">${screen.icon || "🏫"}</div>
            <h3>${screen.heroTitle}</h3>
            <p>${screen.heroText}</p>
            <button class="btn primary">${screen.actions?.[0] || "다음"}</button>
          </div>
        </section>`;
      }

      if (screen.type === "form") {
        return `${steps}<section class="form-panel">
          <div class="form-grid">
            ${(screen.fields || []).map((field, index) => `<div class="field">
              <label>${field}</label>
              ${index % 3 === 1 ? `<select class="select"><option>${field} 선택</option></select>` : `<input class="input" placeholder="${field} 입력" />`}
            </div>`).join("")}
          </div>
        </section>`;
      }

      if (screen.type === "cards") {
        return `${steps}<section class="grid ${screen.cards?.length <= 4 ? "two" : ""}">
          ${(screen.cards || []).map((card, index) => `<article class="card">
            <div>
              <span class="chip ${index === 0 ? "green" : index === 1 ? "yellow" : ""}">${index === 0 ? "추천" : "선택"}</span>
              <h3>${card[0]}</h3>
              <p>${card[1]}</p>
            </div>
            <button class="btn">선택</button>
          </article>`).join("")}
        </section>`;
      }

      if (screen.type === "table") {
        return `${steps}<section class="table-panel">
          <table class="table">
            <thead><tr>${(screen.columns || []).map((column) => `<th>${column}</th>`).join("")}<th>조치</th></tr></thead>
            <tbody>
              ${(screen.rows || []).map((row, rowIndex) => `<tr>
                ${row.map((cell, index) => `<td>${index === row.length - 1 ? `<span class="chip ${cell.includes("위험") || cell.includes("필요") ? "red" : cell.includes("대기") || cell.includes("검토") ? "yellow" : "green"}">${cell}</span>` : cell}</td>`).join("")}
                <td><button class="btn">${rowIndex === 0 ? "상세" : "보기"}</button></td>
              </tr>`).join("")}
            </tbody>
          </table>
        </section>`;
      }

      if (screen.type === "metrics") {
        return `${steps}<section class="grid two">
          ${(screen.metrics || []).map((metric, index) => `<article class="card">
            <div>
              <span class="chip ${index % 2 === 0 ? "green" : ""}">오늘</span>
              <h3>${metric[0]}</h3>
              <div class="metric">${metric[1]}</div>
            </div>
            <p>지난 활동 기준으로 자동 집계됩니다.</p>
          </article>`).join("")}
        </section>
        <section class="timeline-panel">
          <table class="table">
            <tbody>
              <tr><td>09:10</td><td>월급 지급 예약이 준비됐어요.</td><td><span class="chip yellow">확인</span></td></tr>
              <tr><td>10:20</td><td>상점 구매 3건이 발생했어요.</td><td><span class="chip green">정상</span></td></tr>
              <tr><td>11:00</td><td>개인거래 승인 요청이 들어왔어요.</td><td><span class="chip red">처리 필요</span></td></tr>
            </tbody>
          </table>
        </section>`;
      }

      if (screen.type === "timeline") {
        return `${steps}<section class="timeline-panel">
          <table class="table">
            <tbody>
              <tr><td><span class="chip green">1</span></td><td>5학년에게 맞는 소비/저축 난이도입니다.</td></tr>
              <tr><td><span class="chip green">2</span></td><td>1주 운영 기간 안에 완료할 수 있는 활동 수입니다.</td></tr>
              <tr><td><span class="chip yellow">3</span></td><td>세금과 공공예산은 다음 코스로 확장할 수 있어요.</td></tr>
            </tbody>
          </table>
        </section>`;
      }

      return "";
    }

    function renderSummary(screen) {
      const jiraKey = `S15P11B201-${screen.id.split("-")[1]}`;
      const items = [
        ["Jira", jiraKey],
        ["프레임", screen.id],
        ["그룹", screen.group],
        ["완료 체크", (screen.checks || []).join(" · ")],
        ["화면 요소", (screen.summary || []).join(" · ")]
      ];

      summary.innerHTML = items.map((item) => `<div class="summary-item">
        <strong>${item[0]}</strong>
        <span>${item[1]}</span>
      </div>`).join("");
    }

    function render() {
      const screen = screens.find((item) => item.id === currentId) || screens[0];
      document.title = `${screen.id} ${screen.title}`;
      renderList();
      screenTitle.textContent = `${screen.id} ${screen.title}`;
      screenPurpose.textContent = screen.purpose;
      renderActions(screen);
      board.innerHTML = renderBoard(screen);
      renderSummary(screen);
    }

    render();
  </script>
