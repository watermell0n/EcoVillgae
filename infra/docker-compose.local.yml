name: ecovillage-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecovillage}
      POSTGRES_USER: ${POSTGRES_USER:-ecovillage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecovillage-local-password}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - path: ../.env.example
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecovillage}
      DB_USERNAME: ${POSTGRES_USER:-ecovillage}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecovillage-local-password}
      DEMO_TEACHER_LOGIN_ID: ${DEMO_TEACHER_LOGIN_ID:-teacher}
      DEMO_TEACHER_PASSWORD: ${DEMO_TEACHER_PASSWORD:-teacher1234}
      DEMO_TEACHER_DISPLAY_NAME: ${DEMO_TEACHER_DISPLAY_NAME:-이코빌리지 선생님}
      DEMO_ADMIN_LOGIN_ID: ${DEMO_ADMIN_LOGIN_ID:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin1234}
      DEMO_ADMIN_DISPLAY_NAME: ${DEMO_ADMIN_DISPLAY_NAME:-비빔 운영자}
      PRODUCT_IMAGE_DIR: /app/data/product-images
      TZ: UTC
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - product-image-data:/app/data/product-images
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  product-image-data:
